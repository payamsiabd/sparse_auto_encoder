# Default configuration for the RISE-for-Qwen3-VL pipeline.
# CLI scripts (scripts/*.py) read this file and let any field be
# overridden with --key value on the command line.

model:
  model_id: "Qwen/Qwen3-VL-4B-Thinking"
  dtype: "bf16"
  device_map: "auto"
  # "sdpa" works out of the box on both CPU and GPU with no extra install.
  # Switch to "flash_attention_2" for a speedup on GPU once you've
  # `pip install flash-attn` (it needs a matching CUDA toolchain).
  attn_implementation: "sdpa"

mathvista:
  dataset_id: "AI4Math/MathVista"
  split: "testmini"       # 1000 examples w/ public answers; "test" (~5100) has answers withheld
  num_samples: 200        # subsample for a tractable first run; null = use the whole split
  seed: 0
  task_filter: null       # e.g. ["chart question answering", "geometry problem solving"];
                           # see rise.mathvista.VISUAL_HEAVY_TASKS for a starting point
  out_dir: "data/mathvista"

data:
  prompts_jsonl: "data/mathvista/prompts.jsonl"   # written by scripts/00_download_mathvista.py
  image_root: null                                 # defaults to the jsonl file's directory

generation:
  max_new_tokens: 4096
  do_sample: false
  temperature: 0.7
  top_p: 0.8

activations:
  # SAE is trained on ONE layer at a time (Sec. 3.2); this list is which
  # layers get extracted/cached in one pass over the data so you can
  # sweep layers (e.g. to reproduce Fig. 3's per-layer silhouette curve)
  # without regenerating responses each time.
  layers: [8, 12, 16, 20, 24]
  out_dir: "runs/mathvista/activations"

sae:
  d_hidden: 2048        # D, dictionary size (paper default for a small model)
  sparsity_coef: 0.002  # lambda
  sparsity_penalty: "l1"
  batch_size: 1024
  lr: 0.0001
  warmup_frac: 0.10
  num_epochs: 50
  normalize_inputs: true
  seed: 0
  train_layer: 16       # which cached layer to actually train the SAE on
  out_dir: "runs/mathvista/sae"

annotate:
  method: "keyword"      # "keyword" or "llm"
  out_path: "runs/mathvista/annotations.jsonl"

geometry:
  out_dir: "runs/mathvista/geometry"
  top_k_per_step: 1

intervene:
  layer: 16
  alphas: [-1.5, -1.0, 0.0, 1.0, 1.5]
  target_label: "visual_reflection"
  top_k_columns: 20
