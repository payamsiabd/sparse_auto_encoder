# Default configuration for the RISE-for-Qwen3-VL pipeline.
# CLI scripts (scripts/*.py) read this file and let any field be
# overridden with --key value on the command line -- but every default
# below is already a project-local path, so after running
# scripts/00_download_models.py and scripts/01_download_mathvista.py
# once, every later script (02-08) runs with NO arguments at all.

models_root: "models"   # scripts/00_download_models.py downloads each entry below under here

models:
  # `repo_id` may be a registry key from rise.models.MODEL_REGISTRY (as
  # here) or any Hugging Face hub id directly. `name` is the local
  # directory name under `models_root`; model.model_id below points at
  # the first entry's resulting path by construction (models_root/name).
  - name: "Qwen3-VL-4B-Thinking"
    repo_id: "qwen3-vl-4b-thinking"

model:
  model_id: "models/Qwen3-VL-4B-Thinking"   # = models_root/models[0].name; run scripts/00_download_models.py first
  dtype: "bf16"
  device_map: "auto"
  # "sdpa" works out of the box on both CPU and GPU with no extra install.
  # Switch to "flash_attention_2" for a speedup on GPU once you've
  # `pip install flash-attn` (it needs a matching CUDA toolchain).
  attn_implementation: "sdpa"

mathvista:
  dataset_id: "AI4Math/MathVista"
  split: "testmini"       # 1000 examples w/ public answers; "test" (~5100) has answers withheld
  num_samples: 200        # subsample (before splitting) for a tractable first run; null = use the whole split
  train_frac: 0.8         # fraction of the (filtered/subsampled) selection used to fit the SAE;
                           # the rest is held out for scripts/08_evaluate_on_test.py
  seed: 0
  task_filter: null       # e.g. ["chart question answering", "geometry problem solving"];
                           # see rise.mathvista.VISUAL_HEAVY_TASKS for a starting point
  out_dir: "data/mathvista"

data:
  # Both written by scripts/01_download_mathvista.py.
  prompts_jsonl: "data/mathvista/train/prompts.jsonl"        # used by scripts/02-07 (fit the SAE + behavior vectors)
  test_prompts_jsonl: "data/mathvista/test/prompts.jsonl"    # used by scripts/08 (held-out evaluation)
  image_root: null                                            # defaults to the jsonl file's directory

generation:
  # "transformers": model.generate(), one prompt at a time, always available.
  # "vllm": batches every prompt into one engine call for much higher GPU
  # throughput (scripts/02_generate_responses.py only -- see
  # rise/vllm_backend.py for exactly what vLLM can/can't accelerate here).
  # Requires `pip install vllm` with Qwen3-VL support.
  backend: "transformers"
  max_new_tokens: 4096
  do_sample: false
  temperature: 0.7
  top_p: 0.8
  # Only read when backend: "vllm".
  vllm_max_model_len: 16384
  vllm_gpu_memory_utilization: 0.90
  vllm_tensor_parallel_size: 1
  vllm_limit_mm_per_prompt: 4   # max images per prompt

activations:
  # SAE is trained on ONE layer at a time (Sec. 3.2); this list is which
  # layers get extracted/cached in one pass over the data so you can
  # sweep layers (e.g. to reproduce Fig. 3's per-layer silhouette curve)
  # without regenerating responses each time.
  layers: [8, 12, 16, 20, 24]
  out_dir: "runs/mathvista/activations"

sae:
  d_hidden: 2048        # D, dictionary size (paper default for a small model)
  # "topk" (recommended): exactly `k` active latents per sample, guaranteed
  # by construction -- no coefficient tuning needed. "relu": the paper's
  # literal Eq. 1 recipe, sparsity only encouraged indirectly via
  # sparsity_coef, which needs re-tuning per model/layer (see rise/sae.py's
  # module docstring -- this is what produced a ~91% dense, uninterpretable
  # code on Qwen3-VL-4B's layer 16 with the paper's own reported lambda).
  activation: "topk"
  k: 32                 # active latents per sample (activation="topk"); ~1-5% of d_hidden is a reasonable start
  sparsity_coef: 0.002  # lambda; only used when activation="relu"
  sparsity_penalty: "l1"  # only used when activation="relu"
  batch_size: 1024
  lr: 0.0001
  warmup_frac: 0.10
  num_epochs: 50
  normalize_inputs: true
  seed: 0
  train_layer: 16       # which cached layer to actually train the SAE on
  out_dir: "runs/mathvista/sae"

annotate:
  method: "keyword"      # "keyword" or "llm"
  out_path: "runs/mathvista/annotations.jsonl"

geometry:
  out_dir: "runs/mathvista/geometry"
  top_k_per_step: 1

intervene:
  layer: 16
  alphas: [-1.5, -1.0, 0.0, 1.0, 1.5]
  target_label: "visual_reflection"
  top_k_columns: 20

evaluate:
  # scripts/08_evaluate_on_test.py: held-out MathVista test-split results.
  out_dir: "runs/mathvista/evaluate"
  num_samples: null          # test prompts to run for classification agreement; null = all
  num_intervene_samples: 10  # test prompts to run the causal-intervention effect on (3 generations each)
